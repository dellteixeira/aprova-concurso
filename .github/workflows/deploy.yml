name: Deploy AprovaConcurso no Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aprovaconcurso-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Validar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Validar arquivos obrigatórios
        shell: bash
        run: |
          test -f package.json || { echo "ERRO: package.json não encontrado."; exit 1; }
          test -f wrangler.jsonc || { echo "ERRO: wrangler.jsonc não encontrado."; exit 1; }
          test -d public || { echo "ERRO: pasta public não encontrada."; exit 1; }
          test -f public/index.html || { echo "ERRO: public/index.html não encontrado."; exit 1; }

      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
